name: Build WTI Terminal Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify debug APK and SHA256
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk WTI-Research-Terminal-android-debug.apk
          sha256sum WTI-Research-Terminal-android-debug.apk | tee SHA256SUMS.txt
          ls -lh WTI-Research-Terminal-android-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WTI-Terminal-APK-debug
          path: |
            WTI-Research-Terminal-android-debug.apk
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
