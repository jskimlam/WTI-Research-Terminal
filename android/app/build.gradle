plugins { id 'com.android.application' }

android {
    namespace 'com.wti.researchterminal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wti.researchterminal'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
